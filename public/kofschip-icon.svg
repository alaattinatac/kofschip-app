<svg viewBox="0 0 512 512" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#18182E" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Plume Gradient -->
    <linearGradient id="plumeGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Sail Wave Gradient -->
    <linearGradient id="sailWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Nib Gradient -->
    <linearGradient id="goldNibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Center Ambient Light -->
  <circle cx="256" cy="180" r="180" fill="#6366F1" opacity="0.15" filter="blur(40px)" />

  <g transform="translate(48, 48) scale(3.47)" filter="url(#appShadow)">
    <!-- Sail & Wave -->
    <path d="M 22 84 C 36 74, 54 82, 70 78 C 84 75, 96 68, 100 64 C 94 76, 78 86, 62 88 C 42 90, 30 88, 22 84 Z" fill="url(#sailWaveGrad)" opacity="0.85" />
    <path d="M 26 90 C 44 86, 68 93, 94 84 C 84 94, 58 97, 34 94 C 29 93, 26 91, 26 90 Z" fill="url(#sailWaveGrad)" opacity="0.4" />

    <!-- Secondary Sail -->
    <path d="M 52 36 C 40 48, 38 66, 44 76 C 48 72, 54 64, 58 52 C 60 46, 58 40, 52 36 Z" fill="#38BDF8" opacity="0.65" />

    <!-- Feather Plume -->
    <path d="M 88 18 C 94 28, 95 44, 88 56 C 85 53, 84 49, 87 45 C 80 55, 78 64, 73 70 C 70 67, 70 63, 73 59 C 68 66, 64 73, 58 78 L 52 74 C 62 64, 76 46, 84 28 C 86 24, 87 20, 88 18 Z" fill="url(#plumeGrad)" />
    <path d="M 91 16 C 72 26, 56 46, 46 68 L 44 73 L 49 76 C 58 56, 74 36, 91 16 Z" fill="#E0E7FF" />
    <path d="M 48 68 L 38 84 L 43 87 L 53 71 Z" fill="url(#plumeGrad)" />

    <!-- Golden Nib -->
    <path d="M 38 84 L 28 98 L 41 93 L 43 87 Z" fill="url(#goldNibGrad)" />
    <line x1="28" y1="98" x2="36" y2="88" stroke="#78350F" stroke-width="1" stroke-linecap="round" />
    <circle cx="36" cy="88" r="1.2" fill="#78350F" />

    <!-- Learning Twinkle -->
    <g transform="translate(26, 96)">
      <circle cx="0" cy="0" r="2.5" fill="#FDE68A" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" />
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" />
    </g>
  </g>
</svg>
