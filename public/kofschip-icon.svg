<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Sail Gradient Main -->
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Sail Gradient Fore -->
    <linearGradient id="foreSailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.15" />

  <!-- Ship Graphic Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Water Ripple Waves Behind/Under Ship -->
    <path d="M 96 372 C 144 364, 180 376, 228 372 C 276 368, 312 376, 360 372 C 392 369, 416 374, 436 372" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 80 392 C 130 384, 170 396, 220 392 C 270 388, 310 396, 360 392 C 400 388, 420 394, 448 392" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Ship Mast -->
    <line x1="256" y1="110" x2="256" y2="348" stroke="#78350f" stroke-width="9" stroke-linecap="round" />
    <!-- Mast Crossbar (Yard) -->
    <line x1="184" y1="210" x2="330" y2="210" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <line x1="210" y1="130" x2="302" y2="130" stroke="#78350f" stroke-width="4" stroke-linecap="round" />

    <!-- Dutch Flag / Pennant atop mast -->
    <g transform="translate(256, 92)">
      <!-- Red stripe -->
      <path d="M 0 0 L 46 6 L 46 14 L 0 8 Z" fill="#ef4444" />
      <!-- White stripe -->
      <path d="M 0 8 L 46 14 L 46 22 L 0 16 Z" fill="#ffffff" />
      <!-- Blue stripe -->
      <path d="M 0 16 L 46 22 L 46 30 L 0 24 Z" fill="#1d4ed8" />
    </g>

    <!-- Main Large Square Sail (billowing) -->
    <path d="M 188 212 C 218 205, 294 205, 326 212 C 334 262, 330 300, 320 318 C 286 310, 228 310, 194 318 C 184 300, 180 262, 188 212 Z" fill="url(#sailGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Top Sail (Topsail) -->
    <path d="M 212 132 C 232 127, 280 127, 300 132 C 306 168, 304 192, 298 204 C 276 198, 236 198, 214 204 C 208 192, 206 168, 212 132 Z" fill="url(#sailGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Fore Jib Triangular Sail -->
    <path d="M 152 320 L 254 136 C 248 200, 216 280, 152 320 Z" fill="url(#foreSailGrad)" stroke="#cbd5e1" stroke-width="2" opacity="0.9" />

    <!-- Wooden Ship Hull -->
    <path d="M 120 340 L 392 340 C 374 382, 332 404, 256 404 C 180 404, 138 382, 120 340 Z" fill="url(#hullGrad)" stroke="#9a3412" stroke-width="3" />

    <!-- Ship Hull Trim & Portholes / Shields -->
    <path d="M 124 348 C 170 355, 342 355, 388 348" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" />
    <circle cx="200" cy="368" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
    <circle cx="256" cy="372" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
    <circle cx="312" cy="368" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="2" />

    <!-- Water Splash at bow -->
    <path d="M 112 342 Q 102 334 96 348 Q 110 354 122 350 Z" fill="#e0f2fe" opacity="0.8" />
  </g>

  <!-- Crown / Pro Accent Badge in Top-Right Corner -->
  <g transform="translate(378, 48)">
    <circle cx="40" cy="40" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)" />
    <!-- Crown icon -->
    <path d="M 26 50 L 54 50 L 52 34 L 45 42 L 40 28 L 35 42 L 28 34 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="28" cy="32" r="2" fill="#ffffff" />
    <circle cx="40" cy="26" r="2.2" fill="#ffffff" />
    <circle cx="52" cy="32" r="2" fill="#ffffff" />
  </g>
</svg>
